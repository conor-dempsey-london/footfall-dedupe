[project]
dependencies = [
    "arviz>=0.23.4",
    "boto3>=1.42.86",
    "category-encoders>=2.9.0",
    "dtreeviz>=2.3.2",
    "geopandas>=1.1.3",
    "graphviz>=0.21",
    "ipykernel>=7.2.0",
    "kaleido>=1.3.0",
    "lightgbm>=4.6.0",
    "matplotlib-inline>=0.2.1",
    "nbformat>=5.10.4",
    "optuna>=4.8.0",
    "optuna-dashboard>=0.20.0",
    "plotly>=6.7.0",
    "psycopg2-binary>=2.9.11",
    "pymc-extras>=0.9.1",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.8.0",
    "scikit-lego>=0.9.8",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.49",
    "sqlparse>=0.5.5",
    "statsmodels>=0.14.6",
    "supertree>=0.5.5",
]
name = "hs-models"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
hs_models = { path = ".", editable = true }
pymc-extras = {git = "https://github.com/conor-dempsey-london/pymc-extras.git"}

[tool.pixi.tasks]

[tool.pixi.dependencies]
boto3 = ">=1.40.18,<2"
scikit-learn = ">=1.7.1,<2"
bambi = ">=0.15.0,<0.16"
ipykernel = ">=6.30.1,<7"
ipywidgets = ">=8.1.7,<9"
seaborn = ">=0.13.2,<0.14"
arviz = ">=0.22.0,<0.23"
scipy = ">=1.16.2,<2"
python-dotenv = ">=1.1.1,<2"
preliz = ">=0.22.0,<0.23"
typer = ">=0.20.0,<0.21"

[dependency-groups]
dev = []

